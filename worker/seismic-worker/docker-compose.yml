# Seismic worker on seismic-worker.petrolord.com (QI programme Q0).
# Deploy from the studio VPS with ./deploy.sh, which ships a git archive,
# builds here, runs the in-image selfcheck and only then starts the worker.
# Joins the storage project's network so it reaches SeaweedFS by name.
name: seismic-worker
services:
  seismic-worker:
    build:
      context: ./src-tree
      dockerfile: worker/seismic-worker/Dockerfile
      args:
        ENGINE_COMMIT: ${ENGINE_COMMIT:-unknown}
    image: seismic-worker:current
    container_name: seismic-worker
    env_file: .env
    environment:
      ENGINE_COMMIT: ${ENGINE_COMMIT:-unknown}
    restart: unless-stopped
    cpus: "6.0"
    mem_limit: 24g
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:size=1g
    volumes:
      - worker-scratch:/scratch
    networks: [storage]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
  selfcheck:
    profiles: ["verify"]
    image: seismic-worker:current
    entrypoint: ["node", "dist/selfcheck.mjs"]
    restart: "no"
networks:
  storage:
    name: seismic-storage_storage
    external: true
volumes:
  worker-scratch:
