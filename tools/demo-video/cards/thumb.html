<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<style>
/* YouTube thumbnail, 1280x720. Local fonts only (Inter Display is installed
   on the studio box) so a render needs no network and is repeatable.
   Parameters come in the URL hash: frame, mark, text, chip, tag, accent,
   focus (0..1, which part of the frame's width shows in the right-hand panel) and zoom (1 = cover). */
:root{--ink:#0b1d14;--accent:#e8b923;--paper:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:var(--ink);font-family:"Inter Display",Inter,system-ui,sans-serif}
.panel{position:absolute;left:448px;top:0;width:832px;height:720px;overflow:hidden}
#frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,29,20,1) 0%,rgba(11,29,20,1) 35%,rgba(11,29,20,.72) 44%,rgba(11,29,20,.25) 54%,rgba(11,29,20,0) 62%)}
.base{position:absolute;left:0;right:0;bottom:0;height:12px;background:var(--accent)}
.mark{position:absolute;left:52px;top:44px;height:44px}
.textbox{position:absolute;left:52px;top:118px;width:660px;height:430px;display:flex;align-items:center}
h1{margin:0;color:var(--paper);font-weight:900;font-size:96px;line-height:1.0;letter-spacing:-.01em;text-wrap:balance;text-shadow:0 3px 14px rgba(0,0,0,.45)}
h1 em{font-style:normal;color:var(--accent)}
.row{position:absolute;left:52px;bottom:52px;display:flex;gap:14px;align-items:center}
.chip{background:var(--accent);color:#10150f;font-weight:800;font-size:30px;padding:10px 22px;border-radius:999px;letter-spacing:.01em}
.tag{color:var(--paper);font-weight:700;font-size:26px;padding:9px 18px;border-radius:999px;border:3px solid var(--accent);text-transform:uppercase;letter-spacing:.08em}
</style></head>
<body>
<div class="panel"><img id="frame" alt=""></div>
<div class="shade"></div>
<img class="mark" id="mark" alt="Petrolord Suite">
<div class="textbox"><h1 id="text"></h1></div>
<div class="row"><span class="chip" id="chip"></span><span class="tag" id="tag"></span></div>
<div class="base"></div>
<script>
const q = new URLSearchParams(location.hash.slice(1));
document.documentElement.style.setProperty('--accent', q.get('accent') || '#e8b923');
const f = document.getElementById('frame');
f.src = q.get('frame') || '';
const focus = Number(q.get('focus') || 0.75);
const zoom = Number(q.get('zoom') || 1);
f.style.objectPosition = `${(focus * 100).toFixed(1)}% 50%`;
f.style.transformOrigin = `${(focus * 100).toFixed(1)}% 50%`;
f.style.transform = `scale(${zoom})`;
document.getElementById('mark').src = q.get('mark') || '';
// *word* is drawn in the accent colour
document.getElementById('text').innerHTML = (q.get('text') || '').replace(/[<>&]/g, '').replace(/\*(.+?)\*/g, '<em>$1</em>');
document.getElementById('chip').textContent = q.get('chip') || '';
document.getElementById('tag').textContent = q.get('tag') || '';
// shrink the headline until it fits its box (long words, four lines)
const h = document.getElementById('text'); const box = h.parentElement;
let size = 96;
while (size > 56 && (h.scrollHeight > box.clientHeight || h.scrollWidth > box.clientWidth)) { size -= 2; h.style.fontSize = `${size}px`; }
document.body.dataset.fontSize = String(size);
</script>
</body></html>
